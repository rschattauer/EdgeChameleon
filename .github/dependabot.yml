version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Wait before a new action version is proposed, so that a compromised release is noticed first
    cooldown:
      default-days: 10
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - "*"
