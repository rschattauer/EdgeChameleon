name: CI

# Uses pull_request and never pull_request_target, so that code from a fork gets no secrets and only
# a read-only token. Do not add secrets to this workflow: the release workflow runs it as well.
# The push to main and develop checks the result of a merge, and fills the Gradle cache that pull
# requests can read.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A release or a dry run is never cancelled, a superseded pull request run is
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No secrets in the tracked files and the history
        run: ./scripts/check-hygiene.sh HEAD
      - name: Lint the workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check the formatting
        run: ./gradlew ktfmtCheck ktfmtCheckScripts

  android-jvm-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests
        run: ./gradlew :edgechameleon:testAndroidHostTest :edgechameleon:jvmTest
      - name: Compile the web targets
        run: ./gradlew :edgechameleon:compileKotlinJs :edgechameleon:compileKotlinWasmJs
      - name: Build the Android sample
        run: ./gradlew :sample:androidApp:assembleDebug

  apple:
    # iOS and macOS can only be compiled on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile the Apple targets
        run: >-
          ./gradlew
          :edgechameleon:compileKotlinIosArm64
          :edgechameleon:compileKotlinIosSimulatorArm64
          :edgechameleon:compileKotlinMacosArm64
      # Needs all targets compiled. After a deliberate API change, run ./gradlew updateKotlinAbi
      - name: Check the public API
        run: ./gradlew :edgechameleon:checkKotlinAbi
